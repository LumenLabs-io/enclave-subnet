[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enclave-ai"
version = "0.1.0"
description = "A Bittensor subnet scoring agents on verified work per dollar"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["bittensor", "subnet", "agents", "evaluation", "inference-cost"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "structlog>=24.4",
    "typer>=0.15",
]

[project.optional-dependencies]
validator = [
    "bittensor>=11.0.0,<12",
    "bittensor-wallet>=4.1.0",
    "docker>=7.1",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
]
miner = [
    "bittensor>=11.0.0,<12",
    "bittensor-wallet>=4.1.0",
]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
enclave-validator = "enclave.validator.cli:app"
enclave-miner = "enclave.miner_sdk.cli:app"
enclave-score = "enclave.scoring.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/enclave"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4",
    "SIM", "TID", "RUF", "ANN", "S", "T20",
]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["enclave"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["bittensor.*", "docker.*", "substrateinterface.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.per-file-ignores]
"src/enclave/errors.py" = ["N801", "N818"]
"src/enclave/relay/meter.py" = ["N818"]
"src/enclave/chain/payment.py" = ["N818"]
"src/enclave/scoring/records.py" = ["S105"]
"src/enclave/*/cli.py" = ["B008"]
"tests/*" = ["S101", "ANN", "D"]
